name: Update S3 Bucket with OIDC

on:
  push:
    branches:
      - main  # Trigger on push to the main branch (adjust as needed)

permissions:
  id-token: write
  contents: read
  
jobs:
  update_s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME}}  # Update with your role ARN
          aws-region: us-east-1  # Change to your desired AWS region

      - name: Upload file to S3
        run: |
          aws s3 cp path/to/your/file s3://${{ secrets.AWS_S3_BUCKET }}/ --recursive
